<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>THE LOST CULT</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a0a;
    color: #cfcfcf;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    overflow: auto;
  }
  #scaler { transform-origin: center center; }
  #term { }
  /* Start / loading overlay */
  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #171717 0%, #060606 80%);
    text-align: center; gap: 1.4rem; padding: 2rem;
  }
  #overlay h1 {
    font-size: clamp(1.8rem, 6vw, 3.2rem);
    letter-spacing: 0.35em; margin: 0 0 0.2em 0;
    color: #e7e7e7; text-shadow: 0 0 18px rgba(180,0,0,0.55);
  }
  #overlay p { max-width: 46ch; line-height: 1.6; color: #9a9a9a; margin: 0; }
  #startBtn {
    margin-top: 0.6rem;
    font: inherit; font-size: 1.05rem; letter-spacing: 0.15em;
    color: #f0f0f0; background: #1c1c1c;
    border: 1px solid #7a1010; border-radius: 6px;
    padding: 0.8em 2.4em; cursor: pointer;
    transition: background .15s, box-shadow .15s, opacity .15s;
  }
  #startBtn:hover:enabled { background: #2a1010; box-shadow: 0 0 22px rgba(160,0,0,0.45); }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #hint { font-size: 0.8rem; color: #6a6a6a; letter-spacing: 0.05em; }
  .fade-out { animation: fade .5s forwards; }
  @keyframes fade { to { opacity: 0; visibility: hidden; } }
</style>
</head>
<body>
  <div id="stage"><div id="scaler"><div id="term"></div></div></div>

  <div id="overlay">
    <h1>THE&nbsp;LOST&nbsp;CULT</h1>
    <p>A terminal horror-adventure. Navigate the halls of the church, gather
       knowledge, and find your way out &mdash; before you become one of them.</p>
    <button id="startBtn" disabled>Loading&hellip;</button>
    <div id="hint">Best played on a desktop &middot; keyboard required &middot; type answers and press Enter</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script>
  (function () {
    "use strict";

    // ---- Terminal ---------------------------------------------------------
    const COLS = 140, ROWS = 44;
    const term = new Terminal({
      cols: COLS, rows: ROWS,
      convertEol: true,            // treat "\n" like the Windows console (CRLF)
      cursorBlink: true,
      fontFamily: 'ui-monospace, "Cascadia Code", Consolas, monospace',
      fontSize: 14,
      theme: {
        background: "#0a0a0a", foreground: "#d0d0d0",
        cursor: "#d0d0d0", black: "#0a0a0a", brightBlack: "#555555"
      }
    });
    term.open(document.getElementById("term"));

    // Scale the fixed-size terminal to fit the viewport.
    const scaler = document.getElementById("scaler");
    function rescale() {
      const el = term.element;
      if (!el) return;
      const w = el.offsetWidth, h = el.offsetHeight;
      if (!w || !h) return;
      const s = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
      scaler.style.transform = "scale(" + s + ")";
    }
    window.addEventListener("resize", rescale);
    setTimeout(rescale, 0);

    // ---- stdout: raw bytes -> terminal ------------------------------------
    let outBytes = [], flushQueued = false;
    const decoder = new TextDecoder("utf-8", { fatal: false });
    function flushOut() {
      flushQueued = false;
      if (!outBytes.length) return;
      const s = decoder.decode(new Uint8Array(outBytes), { stream: true });
      outBytes = [];
      term.write(s);
    }
    function ttyOut(code) {
      if (code === null || code === undefined) { if (!flushQueued) { flushQueued = true; queueMicrotask(flushOut); } return; }
      outBytes.push(code);
      if (!flushQueued) { flushQueued = true; queueMicrotask(flushOut); }
    }

    // ---- stdin ------------------------------------------------------------
    // A single canonical (line-buffered, echoed) stream feeds getchar()/scanf
    // replacements; getch() grabs one raw key. Both block via Asyncify.
    let typeahead = [];     // keys typed while nothing is waiting
    let inbuf = [];         // completed line chars ready for getchar()
    let ungot = [];         // chars pushed back by the scanf shims
    let lineBuf = [];       // the line currently being edited
    let keyResolver = null; // pending getch()
    let lineResolver = null;// pending line read

    function editLine(code) {
      if (code === 13 || code === 10) {            // Enter
        term.write("\r\n");
        for (const c of lineBuf) inbuf.push(c);
        inbuf.push(10);
        lineBuf = [];
        const r = lineResolver; lineResolver = null;
        if (r) r();
      } else if (code === 127 || code === 8) {     // Backspace
        if (lineBuf.length) { lineBuf.pop(); term.write("\b \b"); }
      } else if (code >= 32 && code < 127) {       // printable
        lineBuf.push(code);
        term.write(String.fromCharCode(code));
      }
    }

    function feedChar(code) {
      if (keyResolver) { const r = keyResolver; keyResolver = null; r(code); }
      else if (lineResolver) { editLine(code); }
      else { typeahead.push(code); }
    }

    term.onData(function (data) {
      for (let i = 0; i < data.length; i++) feedChar(data.charCodeAt(i));
    });

    window.LostCult = {
      term: term,
      feed: function (s) { for (let i = 0; i < s.length; i++) feedChar(s.charCodeAt(i)); },
      screen: function () {
        const b = term.buffer.active, out = [];
        for (let y = 0; y < b.length; y++) out.push(b.getLine(y).translateToString(true));
        return out.join("\n").replace(/\n+$/, "");
      }
    };

    function startLine() {
      return new Promise(function (resolve) {
        lineResolver = resolve;
        const pending = typeahead; typeahead = [];
        for (let i = 0; i < pending.length; i++) {
          if (lineResolver) editLine(pending[i]);
          else { typeahead.push(pending[i]); } // line completed mid-drain
        }
      });
    }

    // Exposed to the C layer (see web compatibility layer in the .c file):
    window.Module = window.Module || {};
    Module.inputGetch = function () {
      return new Promise(function (resolve) {
        if (typeahead.length) { resolve(typeahead.shift()); return; }
        keyResolver = resolve;
      });
    };
    Module.inputGetChar = function () {
      return new Promise(function (resolve) {
        if (ungot.length) { resolve(ungot.pop()); return; }
        if (inbuf.length) { resolve(inbuf.shift()); return; }
        startLine().then(function () { resolve(inbuf.shift()); });
      });
    };
    Module.inputUnget = function (c) { if (c >= 0) ungot.push(c); };

    // ---- Emscripten Module wiring ----------------------------------------
    Module.noInitialRun = true;
    Module.preRun = [function () {
      // Route stdin (unused) and stdout/stderr through the terminal.
      FS.init(function () { return null; }, ttyOut, ttyOut);
    }];

    const startBtn = document.getElementById("startBtn");
    const overlay = document.getElementById("overlay");
    let started = false;

    Module.onRuntimeInitialized = function () {
      startBtn.disabled = false;
      startBtn.textContent = "Enter the Church";
    };
    Module.onExit = function () {
      ttyOut(null);
      term.write("\r\n\x1b[1;33m[ The tape ends. Refresh the page to play again. ]\x1b[0m\r\n");
    };

    startBtn.addEventListener("click", function () {
      if (started || startBtn.disabled) return;
      started = true;
      overlay.classList.add("fade-out");
      term.focus();
      rescale();
      try { Module.callMain([]); } catch (e) { console.error(e); }
    });
  })();
  </script>
  <script src="game.js"></script>
</body>
</html>
